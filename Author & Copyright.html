
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Author & Copyright - Marcin Słowik</title>
<meta name="description" content="Author and copyright information – Marcin Słowik.">
<link rel="icon" type="image/png" href="logo3.png">
<style>
  *, *::before, *::after { box-sizing: border-box; }

  html, body { min-height: 100%; }

  body {
    margin: 0;
    font-family: 'Courier New', Courier, monospace;
    background-color: #0d0d0d;
    color: #ccc;
    position: relative;
  }

  /* Tło ze zdjęciem – osobna warstwa, działa też na telefonach (iOS) */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -2;
    background: #0d0d0d url("boobxx.png") center center / cover no-repeat;
  }

  /* Delikatne przyciemnienie tła */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    background: rgba(0, 0, 0, 0.15);
  }

  /* Pasek z całym napisem – tylko na telefonie */
  .hero { display: none; }

  header {
    height: 30px;
    background: rgba(0, 0, 0, 0.85);
    border-bottom: 1px solid #cc3347;
  }

  nav#top_menu {
    background: rgba(0, 0, 0, 0.85);
    display: flex;
    justify-content: center;
    border-bottom: 1px solid #cc3347;
    padding: 15px;
  }

  nav#top_menu img {
    max-width: 100%;
    height: auto;
  }

  #main {
    max-width: 900px;
    margin: 30px auto;
    padding: 0 15px;
  }

  .back-btn {
    display: inline-block;
    margin-bottom: 20px;
    padding: 10px 20px;
    color: #da7c7f;
    border: 1px solid #2eb82e;
    background: rgba(0, 0, 0, 0.55);
    text-decoration: none;
    border-radius: 3px;
    font-weight: bold;
    text-transform: uppercase;
    transition: all 0.3s;
  }

  .back-btn:hover { background-color: rgba(46, 184, 46, 0.15); }

  /* Półprzezroczysty panel na tle obrazka */
  .author-section {
    background: rgba(12, 12, 12, 0.62);
    -webkit-backdrop-filter: blur(3px);
    backdrop-filter: blur(3px);
    border: 1px solid rgba(212, 175, 55, 0.35);
    border-left: 3px solid #d4af37;
    border-radius: 3px;
    padding: 30px;
    color: #e6e6e6;
    line-height: 1.6;
  }

  .author-section p { margin: 0 0 14px 0; }

  .author-name {
    font-size: 1.2em;
    margin-bottom: 20px !important;
  }

  .author-name strong { color: #d4af37; }

  .links {
    list-style: none;
    padding: 0;
    margin: 0 0 24px 0;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
  }

  .pdf-badge-btn,
  .pdf-badge-btn1,
  .pdf-badge-btn2 {
    display: inline-block;
    padding: 8px 14px;
    font-size: 0.9em;
    background: rgba(0, 0, 0, 0.45);
    text-decoration: none;
    border-radius: 2px;
    font-weight: bold;
    transition: all 0.2s;
    word-break: break-all;
  }

  .pdf-badge-btn  { color: #d4af37; border: 1px solid #cc3347; }
  .pdf-badge-btn1 { color: #2eb82e; border: 1px solid #1E90FF; }
  .pdf-badge-btn2 { color: #1E90FF; border: 1px solid #d4af37; }

  .pdf-badge-btn:hover,
  .pdf-badge-btn1:hover,
  .pdf-badge-btn2:hover {
    background-color: rgba(212, 175, 55, 0.18);
    color: #ffcc00;
  }

  .copyright {
    border-top: 1px dashed rgba(255, 255, 255, 0.2);
    padding-top: 18px;
    font-size: 0.92em;
  }

  .copyright p:last-child { margin-bottom: 0; }

  @media (max-width: 768px) {
    /* na telefonie obrazek jest pokazany w całości (z napisem FiNiTE CORE), nie przycięty */
    body::before, body::after { display: none; }
    .hero {
      display: block;
      width: 100%;
      aspect-ratio: 1200 / 627;
      background: #0d0d0d url("boobxx.png") center center / 100% 100% no-repeat;
      border-bottom: 1px solid #cc3347;
    }
    .author-section { background: rgba(12, 12, 12, 0.85); }
    #main { margin: 20px auto; }
    .author-section { padding: 20px 16px; }
    .links { flex-direction: column; }
    .links a { display: block; text-align: center; }
    .back-btn { display: block; text-align: center; }
  }
</style>
</head>
<body>

<header></header>

<nav id="top_menu">
  <img src="logo3.png" alt="Logo">
</nav>

<div class="hero" role="img" aria-label="Finite Core"></div>

<div id="main">
  <a href="index.html" class="back-btn">&larr; HOME</a>

  <div class="author-section">
    <p class="author-name"><strong>Author:</strong> Marcin Słowik</p>

    <ul class="links">
      <li><a href="https://orcid.org/0009-0004-6707-4546" class="pdf-badge-btn">orcid:0009-0004-6707-4546</a></li>
      <li><a href="https://www.linkedin.com/in/marcin-s%C5%82owik-682ba7407" class="pdf-badge-btn1">Linkedin.com</a></li>
      <li><a href="https://www.youtube.com/@Rospek-xiixim" class="pdf-badge-btn2">Youtube.com</a></li>
    </ul>

    <div class="copyright">
      <p>All materials, texts, layouts, and source code of this monograph and website are protected by copyright law.</p>
      <p><strong>© 2026 Marcin Słowik. All Rights Reserved.</strong></p>
    </div>
  </div>
</div>

</body>
</html>
