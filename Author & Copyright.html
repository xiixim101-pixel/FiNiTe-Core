
<!DOCTYPE html>

<head>

<link rel="icon" type="image/png" href="logo3.png">
<style>
  *, *::before, *::after { box-sizing: border-box; }

  html, body { min-height: 100%; }

  body {
    margin: 0;
    font-family: 'Courier New', Courier, monospace;
    background-color: #0d0d0d;
    color: #ccc;
    position: relative;
  }

  /* Tło ze zdjęciem */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -2;
    background: #0d0d0d url("boobxx.png") center center / cover no-repeat;
  }

  body::after {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    background: rgba(0, 0, 0, 0.15);
  }

  .hero { display: none; }

  header {
    height: 30px;
    background: rgba(0, 0, 0, 0.85);
    border-bottom: 1px solid #cc3347;
  }

  nav#top_menu {
    background: rgba(0, 0, 0, 0.85);
    display: flex;
    justify-content: center;
    border-bottom: 1px solid #cc3347;
    padding: 15px;
  }

  nav#top_menu img { max-width: 100%; height: auto; }

  #main {
    max-width: 760px;
    margin: 30px auto;
    padding: 0 15px;
  }

  .back-link {
    display: inline-block;
    margin-bottom: 18px;
    padding: 8px 0;
    color: #aaa;
    text-decoration: none;
    font-size: 0.9em;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    border-bottom: 1px solid transparent;
    transition: color 0.2s, border-color 0.2s;
  }

  .back-link:hover { color: #fff; border-bottom-color: #888; }

  /* Panel */
  .author-section {
    background: rgba(12, 12, 12, 0.72);
    -webkit-backdrop-filter: blur(3px);
    backdrop-filter: blur(3px);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-left: 3px solid #d4af37;
    border-radius: 2px;
    padding: 32px 34px;
    color: #d6d6d6;
    line-height: 1.7;
  }

  .author-section h1 {
    margin: 0 0 4px 0;
    font-size: 1.5em;
    font-weight: normal;
    letter-spacing: 1px;
    color: #f0f0f0;
  }

  .role {
    margin: 0 0 24px 0;
    font-size: 0.85em;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #d4af37;
  }

  .info { margin: 0; padding: 0; }

  .info-row {
    display: flex;
    gap: 20px;
    padding: 12px 0;
    border-top: 1px solid rgba(255, 255, 255, 0.12);
  }

  .info-row dt {
    flex: 0 0 110px;
    margin: 0;
    font-size: 0.8em;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #8a8a8a;
    padding-top: 2px;
  }

  .info-row dd { margin: 0; word-break: break-word; }

  .info-row a {
    color: #e0e0e0;
    text-decoration: none;
    border-bottom: 1px solid #666;
    transition: color 0.2s, border-color 0.2s;
  }

  .info-row a:hover { color: #fff; border-bottom-color: #d4af37; }

  .copyright {
    margin-top: 12px;
    padding-top: 18px;
    border-top: 1px solid rgba(255, 255, 255, 0.12);
    font-size: 0.88em;
    color: #aaa;
  }

  .copyright p { margin: 0 0 8px 0; }
  .copyright p:last-child { margin-bottom: 0; color: #d6d6d6; }

  @media (max-width: 768px) {
    body::before, body::after { display: none; }
    .hero {
      display: block;
      width: 100%;
      aspect-ratio: 1200 / 627;
      background:
        linear-gradient(to bottom, rgba(13,13,13,0) 65%, #0d0d0d 100%),
        url("boobxx.png") center center / 100% 100% no-repeat;
      filter: brightness(1.35) contrast(1.05);
      margin-bottom: -30px;
    }
    #main { margin: 20px auto; }
    .author-section { padding: 22px 18px; background: rgba(12, 12, 12, 0.78); }
    .author-section h1 { font-size: 1.3em; }
    .info-row { flex-direction: column; gap: 2px; }
    .info-row dt { flex: none; }
  }
</style>
</head>

    </div>
  </div>
</div>
